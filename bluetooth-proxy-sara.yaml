substitutions:
  name: bluetooth-proxy-sara
  friendly_name: Bluetooth Proxy Sara
  detector_name: Tracker Sara

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .home
  
  ap:
    ssid: "Bluetooth-Proxy-Sara"
    password: !secret ap_password

bluetooth_proxy:
  active: true

# ==============================================================================
# Inclusione Modulare Package Finder YESLY Mesh (Zero Custom Code nel file nodo)
# ==============================================================================
packages:
  finder_yesly: !include packages/finder_yesly_mesh.yaml

switch:
  - platform: restart
    id: switch_restart
    name: ${friendly_name} Restart

time:
  - platform: sntp
    on_time:
      - seconds: 0
        minutes: 0
        hours: 2
        then:
          - switch.toggle: switch_restart
